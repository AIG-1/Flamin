backend:
  name: git-gateway
  branch: main

media_folder: "assets/uploads"
public_folder: "/assets/uploads"
site_url: https://flaminhc.netlify.app
logo_url: /assets/img/logo.png

collections:
  - name: settings
    label: "Restaurant Settings"
    files:
      - name: site
        label: "Info, Hours, Order Links, Video, Announcement"
        file: "content/site.json"
        fields:
          - { label: "Restaurant Name", name: name, widget: string }
          - { label: "Tagline", name: tagline, widget: string }
          - { label: "Logo", name: logo, widget: image }
          - { label: "Homepage Background (mural)", name: background, widget: image }
          - { label: "Phone", name: phone, widget: string, required: false, hint: "Leave blank to hide the Call button" }
          - { label: "Street Address", name: address, widget: string }
          - { label: "City, State ZIP", name: city, widget: string }
          - { label: "Google Maps Link", name: mapsUrl, widget: string }
          - { label: "Instagram Link", name: instagram, widget: string }
          - { label: "Show Halal Badge", name: halal, widget: boolean, default: true }
          - label: "Announcement Bar"
            name: announcement
            widget: object
            fields:
              - { label: "Show", name: show, widget: boolean, default: true }
              - { label: "Text", name: text, widget: string, required: false }
              - { label: "Link (optional)", name: link, widget: string, required: false, hint: "e.g. /menu.html#monster-platter" }
          - label: "Hours"
            name: hours
            widget: list
            allow_add: false
            summary: "{{fields.day}}: {{fields.open}}–{{fields.close}}"
            fields:
              - { label: "Day", name: day, widget: string }
              - { label: "Opens (24h, e.g. 11:00)", name: open, widget: string }
              - { label: "Closes (24h; 24:00 = midnight, 02:00 = 2 AM)", name: close, widget: string }
              - { label: "Closed all day", name: closed, widget: boolean, default: false }
          - { label: "Holiday / Special Hours Notice", name: holidayNotice, widget: string, required: false, hint: "Shows in the top bar. Leave blank when not needed." }
          - label: "Order Links (used on every menu item)"
            name: orderLinks
            widget: list
            summary: "{{fields.label}}"
            fields:
              - { label: "Button Label", name: label, widget: string }
              - { label: "URL", name: url, widget: string, required: false, hint: "Blank = button hidden" }
              - { label: "Show", name: show, widget: boolean, default: true }
          - label: "Homepage Video (next to logo)"
            name: video
            widget: object
            fields:
              - { label: "Title", name: title, widget: string }
              - { label: "Upload Video (MP4, keep under 20 MB)", name: file, widget: file, required: false }
              - { label: "OR YouTube Link", name: youtubeUrl, widget: string, required: false }
              - { label: "OR Instagram Reel Link", name: instagramUrl, widget: string, required: false, hint: "Paste a reel URL, e.g. https://www.instagram.com/reel/XXXX/" }
              - { label: "Cover Image", name: poster, widget: image, required: false }
          - label: "SEO"
            name: seo
            widget: object
            collapsed: true
            fields:
              - { label: "Page Title", name: title, widget: string }
              - { label: "Description", name: description, widget: text }

  - name: banner
    label: "Homepage Banner"
    files:
      - name: slides
        label: "Banner Slides"
        file: "content/banner.json"
        fields:
          - label: "Slides"
            name: slides
            widget: list
            summary: "{{fields.headline}}"
            fields:
              - { label: "Headline", name: headline, widget: string }
              - { label: "Subtext", name: subtext, widget: string, required: false }
              - { label: "Image", name: image, widget: image, required: false }
              - { label: "Menu Item ID it links to", name: itemId, widget: string, required: false, hint: "Copy the item's ID from the Menu (e.g. monster-platter)" }
              - { label: "Show", name: show, widget: boolean, default: true }

  - name: menu
    label: "Menu"
    files:
      - name: menu
        label: "Menu Categories & Items"
        file: "content/menu.json"
        fields:
          - label: "Categories"
            name: categories
            widget: list
            summary: "{{fields.name}}"
            fields:
              - { label: "Category Name", name: name, widget: string }
              - { label: "Category ID (no spaces)", name: id, widget: string }
              - { label: "Category Note", name: note, widget: text, required: false }
              - { label: "Show Category", name: show, widget: boolean, default: true }
              - label: "Items"
                name: items
                widget: list
                summary: "{{fields.name}}"
                fields:
                  - { label: "Item Name", name: name, widget: string }
                  - { label: "Item ID (no spaces, used by banner links)", name: id, widget: string }
                  - { label: "Description", name: description, widget: text, required: false }
                  - { label: "Photo", name: image, widget: image, required: false }
                  - label: "Sizes / Prices"
                    name: options
                    widget: list
                    summary: "{{fields.label}} {{fields.price}}"
                    fields:
                      - { label: "Size / Label (blank for single price)", name: label, widget: string, required: false }
                      - { label: "Price", name: price, widget: string, required: false, hint: "e.g. $12.99" }
                  - { label: "Price Confirmed", name: priceConfirmed, widget: boolean, default: true, hint: "Off = shows 'Price coming soon'" }
                  - { label: "Tags", name: tags, widget: list, required: false, hint: "e.g. Spicy, New" }
                  - { label: "Sold Out Today", name: soldOut, widget: boolean, default: false }
                  - { label: "Feature on Homepage", name: featured, widget: boolean, default: false }
                  - label: "Item-specific Order Links (optional, overrides the defaults)"
                    name: orderLinks
                    widget: list
                    required: false
                    fields:
                      - { label: "Label", name: label, widget: string }
                      - { label: "URL", name: url, widget: string }
                      - { label: "Show", name: show, widget: boolean, default: true }

  - name: specials
    label: "Specials"
    files:
      - name: specials
        label: "Daily / Weekly Specials"
        file: "content/specials.json"
        fields:
          - label: "Specials"
            name: specials
            widget: list
            summary: "{{fields.title}}"
            fields:
              - { label: "Title", name: title, widget: string }
              - { label: "Details", name: text, widget: text }
              - { label: "Image", name: image, widget: image, required: false }
              - { label: "Links to Menu Item ID", name: itemId, widget: string, required: false }
              - { label: "Start Date", name: start, widget: datetime, format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false, required: false }
              - { label: "End Date", name: end, widget: datetime, format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false, required: false }
              - { label: "Show", name: show, widget: boolean, default: true }

  - name: gallery
    label: "Photos & Videos"
    files:
      - name: gallery
        label: "Gallery (drag to reorder; the first video in the list is featured at the top)"
        file: "content/gallery.json"
        fields:
          - label: "Items"
            name: items
            widget: list
            summary: "{{fields.caption}}"
            fields:
              - { label: "Type", name: type, widget: select, options: ["image", "video", "instagram"], default: "image" }
              - { label: "Upload Photo or Video", name: src, widget: file, required: false }
              - { label: "Instagram Post/Reel Link (when Type = instagram)", name: instagram, widget: string, required: false }
              - { label: "Caption", name: caption, widget: string, required: false }
              - { label: "Date posted (shown under the caption)", name: date, widget: datetime, format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false, required: false }
              - { label: "Show", name: show, widget: boolean, default: true }

  - name: reviews
    label: "Reviews"
    files:
      - name: reviews
        label: "Customer Reviews"
        file: "content/reviews.json"
        fields:
          - { label: "Intro line", name: intro, widget: string, required: false }
          - label: "Reviews (approved only, copy from the Review form inbox in Netlify)"
            name: reviews
            widget: list
            required: false
            summary: "{{fields.rating}}★ {{fields.name}}"
            fields:
              - { label: "First name", name: name, widget: string }
              - { label: "City", name: location, widget: string, required: false }
              - { label: "Rating", name: rating, widget: select, options: ["5", "4", "3", "2", "1"], default: "5" }
              - { label: "Review", name: text, widget: text }
              - { label: "Show", name: show, widget: boolean, default: true }
          - label: "Instagram creator videos (As seen on Instagram)"
            name: creators
            widget: list
            required: false
            summary: "{{fields.name}}"
            fields:
              - { label: "Creator name", name: name, widget: string }
              - { label: "Reel link", name: instagram, widget: string }
              - { label: "Show", name: show, widget: boolean, default: true }
